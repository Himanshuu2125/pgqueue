name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
      - name: Lint
        run: make lint
      - name: Test (testcontainers uses the runner's Docker)
        run: make test
      - name: Build images
        run: |
          docker build --build-arg CMD=api .
          docker build --build-arg CMD=worker .
